<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mochi Fly</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#ffe9d6;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hide{display:none!important}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:5}
  .card{pointer-events:auto;background:#fff;border:4px solid #1f2230;border-radius:28px;padding:22px 24px;box-shadow:0 8px 0 #1f2230;max-width:90vw}
  h1{font-size:36px;color:#1f2230}
  h1 span{color:#f0a020}
  p{color:#555;font-size:15px;margin-top:6px;line-height:1.35}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;text-align:left;font-size:13px;color:#333;margin-top:10px}
  .big{font-size:56px;font-weight:900;color:#f0a020;line-height:1}
  .row{display:flex;gap:18px;justify-content:center;margin:10px 0 4px;color:#1f2230;font-weight:700}
  button{pointer-events:auto;font:inherit;font-size:20px;font-weight:800;border:4px solid #1f2230;border-radius:18px;padding:12px 28px;margin-top:12px;background:#f0a020;color:#fff;box-shadow:0 5px 0 #1f2230;cursor:pointer}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #1f2230}
  button.alt{background:#f48fb1;font-size:16px;padding:9px 20px}
  .new{color:#e8457a;font-weight:900;animation:pop .6s ease infinite alternate}
  @keyframes pop{to{transform:scale(1.15)}}
  #hud{position:fixed;top:14px;left:0;right:0;text-align:center;font-size:54px;font-weight:900;color:#fff;-webkit-text-stroke:3px #1f2230;pointer-events:none;transition:transform .1s;z-index:3}
  #combo{position:fixed;top:80px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;color:#e8457a;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
  #fx{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;pointer-events:none;z-index:3}
  .fx{background:#fff;border:3px solid #1f2230;border-radius:12px;padding:3px 7px;font-size:15px;font-weight:900;color:#1f2230;position:relative;overflow:hidden}
  .fx i{position:absolute;left:0;bottom:0;height:3px;background:#f0a020}
  .fx.bad{background:#ffd0dc}
  #toast{position:fixed;top:32%;left:0;right:0;text-align:center;font-size:30px;font-weight:900;color:#fff;-webkit-text-stroke:2px #1f2230;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;z-index:4}
  .boostBox{margin-top:10px;text-align:center}
  .boostBox .bt{font-size:12px;font-weight:800;color:#1f2230;margin-bottom:5px}
  .boostBox .bp{display:inline-block;margin:3px;padding:5px 9px;border:3px solid #1f2230;border-radius:12px;background:#bdf5c6;font-size:13px;font-weight:800;color:#1f2230;cursor:pointer}
  .boostBox .bp.off{background:#ddd;opacity:.6;text-decoration:line-through}
  .boostBox .bnone{font-size:12px;color:#888;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">0</div>
<div id="combo">x2 КОМБО!</div>
<div id="fx"></div>
<div id="toast"></div>

<div id="start" class="ui">
  <div class="card">
    <h1>MOCHI <span>FLY</span></h1>
    <p>Тапай — Моти мягко подпрыгивает.<br>Пролетай между палочками, собирай булочки 🍥 и бонусы в пузырях!</p>
    <div class="legend">
      <div>🛡 Щит от удара</div><div>🐢 Замедление</div>
      <div>🌈 Дорога без палочек</div><div>🧲 Магнит булочек</div>
      <div>🔹 Мини-Моти</div><div>💰 Очки x2</div>
      <div>🌶 Ускорение (ой!)</div><div>🍰 Толстый Моти (ой!)</div>
    </div>
    <div class="boostBox"></div>
    <div class="row">🏆 Рекорд: <span id="bestStart">0</span></div>
    <button id="playBtn">ИГРАТЬ</button><br>
    <button class="alt menuBtn">← В меню</button>
  </div>
</div>

<div id="over" class="ui hide">
  <div class="card">
    <h1>Ой-ой! 🥺</h1>
    <div class="big" id="final">0</div>
    <div id="newBest" class="new hide">НОВЫЙ РЕКОРД!</div>
    <div class="row"><span>🏆 <span id="best">0</span></span><span>🍥 <span id="buns">0</span></span><span>✨ <span id="pws">0</span></span></div>
    <p id="rank"></p>
    <div class="boostBox"></div>
    <button id="againBtn">ЕЩЁ РАЗ</button><br>
    <button id="shareBtn" class="alt">Похвастаться 📣</button>
    <button class="alt menuBtn">← В меню</button>
  </div>
</div>

const cv = $('c'), ctx = cv.getContext('2d', { alpha: false });
let gradCache = {}, bgKey = '', bgGrad = null, fxKey = '';
function stickGrad(sw){ const k = Math.round(sw); let g = gradCache[k]; if (!g){ g = ctx.createLinearGradient(0,0,sw,0); g.addColorStop(0,'#c9824a'); g.addColorStop(.5,'#e8a868'); g.addColorStop(1,'#b06d38'); gradCache[k] = g; } return g; }
let W, H, DPR;
// ---------- производительность: если кадров мало — снижаем чёткость ----------
let dprCap = 2, perfAcc = 0, perfN = 0;
function perfTick(ms){ if (ms > 100 || ms <= 0) return; perfAcc += ms; perfN++;
  if (perfN >= 120){ const avg = perfAcc/perfN; perfAcc = perfN = 0;
    if (avg > 20 && dprCap > 1){ dprCap = dprCap > 1.5 ? 1.5 : 1; resize(); } } }
function resize(){ DPR = Math.min(devicePixelRatio||1, dprCap); gradCache = {}; bgKey = ''; W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();
if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};

const store = { get(){ try{return +localStorage.getItem('mochi_best')||0}catch(e){return 0} }, set(v){ try{localStorage.setItem('mochi_best',v)}catch(e){} } };
let best = store.get(); $('bestStart').textContent = best;

// ---------- звук ----------
let ac;
function beep(f, d=.08, type='sine', vol=.1, slide=0){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
  if(slide) o.frequency.exponentialRampToValueAtTime(f*slide, ac.currentTime+d);
  g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+d);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+d); }catch(e){} }
const sfx = { jump:()=>beep(520,.12,'sine',.1,1.6), coin:()=>{beep(880,.08,'square',.05);setTimeout(()=>beep(1320,.1,'square',.05),70)},
  score:()=>beep(700,.05,'triangle',.05), hit:()=>beep(200,.35,'sawtooth',.12,.3),
  good:()=>[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.1,'square',.05),i*60)),
  bad:()=>[500,380,260].forEach((f,i)=>setTimeout(()=>beep(f,.14,'sawtooth',.06),i*90)),
  shield:()=>beep(300,.25,'triangle',.15,3) };

function start(){ reset();
  const used = takeBoosts(); extraLife = 0;
  if (used.fly_shield) shield = true; if (used.fly_slow) fx.slow = 600; if (used.fly_x2) fx.x2 = 1200; if (used.fly_life) extraLife = 1;
  const bt = boostToast(used); if (bt) setTimeout(()=>toast(bt), 300); renderFx(); renderBoosts();
  state='play'; $('start').classList.add('hide'); $('over').classList.add('hide'); $('hud').classList.remove('hide'); $('hud').textContent='0'; flap(); }

function applyPw(k){
  const P = PW[k]; pwCount++;
  if (k === 'shield') shield = true; else fx[k] = P.d;
  if (k === 'pepper') fx.slow = 0; if (k === 'slow') fx.pepper = 0;
  if (k === 'tiny') fx.cake = 0;   if (k === 'cake') fx.tiny = 0;
  if (k === 'clear'){ for (const pp of pipes) if (pp.x > p.x + R()*2){ burst(pp.x+pp.w/2, pp.top+pp.gap/2, ['#fff','#f48fb1','#ffc93c','#8fd16a'], 20, 6); pp.gone = true; } pipes = pipes.filter(pp => !pp.gone); }
  toast(P.e + ' ' + P.n, P.good); P.good ? (sfx.good(), haptic('good')) : (sfx.bad(), haptic('hit'));
  burst(p.x, p.y, P.good ? ['#ffc93c','#fff','#8fd16a'] : ['#e8457a','#1f2230'], 18, 5);
}
function hit(pp){
  if (inv > 0 || state !== 'play') return;
  if (shield){ shield = false; inv = 70; sfx.shield(); haptic('hit'); shake = 8; toast('Щит спас! 🛡');
    if (pp){ burst(pp.x+pp.w/2, p.y, ['#c98a55','#e8a868','#fff'], 20, 6); pipes = pipes.filter(q => q !== pp); } return; }
  die();
}
function die(){
  if (state !== 'play') return;
  if (extraLife > 0){ extraLife--; inv = 150; shield = true; p.y = H*.4; p.vy = -H*.006; sfx.good(); haptic('good');
    pipes = pipes.filter(pp => pp.x > p.x + R()*3 || pp.x + pp.w < p.x - R()*2); toast('❤️ Вторая жизнь!'); renderFx(); return; } state = 'dead'; shake = 18; sfx.hit(); haptic('hit');
  burst(p.x, p.y, ['#f0a020','#f48fb1','#fff'], 30, 6);
  setTimeout(()=>{
    const isNew = score > best; if (isNew){ best = score; store.set(best); }
    $('final').textContent = score; $('best').textContent = best; $('buns').textContent = buns; $('pws').textContent = pwCount; $('bestStart').textContent = best;
    $('newBest').classList.toggle('hide', !isNew);
    $('rank').textContent = score>=60?'Легенда моти-мира 👑':score>=30?'Моти-мастер 🔥':score>=12?'Неплохо летаешь! 😎':'Моти верит в тебя 💪';
    renderBoosts(); $('over').classList.remove('hide'); $('hud').classList.add('hide'); $('fx').innerHTML = ''; fxKey = '';
  }, 650);
}

// ---------- бонусы из Mochi Casino ----------
const MYB = {"fly_shield": {"e": "🛡️", "n": "Щит на старте", "d": "Защитит от первого удара", "p": 150}, "fly_slow": {"e": "🐢", "n": "Медленный старт", "d": "Первые 10 секунд всё замедлено", "p": 120}, "fly_x2": {"e": "💰", "n": "Очки x2", "d": "Двойные очки первые 20 секунд", "p": 250}, "fly_life": {"e": "❤️", "n": "Вторая жизнь", "d": "Один раз воскресит Моти после удара", "p": 400}};
function getBoosts(){ try{ return JSON.parse(localStorage.getItem('mochi_boosts')) || {}; }catch(e){ return {}; } }
function setBoosts(b){ try{ localStorage.setItem('mochi_boosts', JSON.stringify(b)); }catch(e){} }
const boostOff = {};
function renderBoosts(){
  const b = getBoosts(), own = Object.keys(MYB).filter(k => b[k] > 0);
  document.querySelectorAll('.boostBox').forEach(el => {
    if (!own.length){ el.innerHTML = '<div class="bnone">🎰 Бонусы для этой игры можно купить в Mochi Casino</div>'; return; }
    el.innerHTML = '<div class="bt">🎰 Бонусы из казино — нажми, чтобы выключить:</div>' + own.map(k => `<span class="bp ${boostOff[k] ? 'off' : ''}" data-k="${k}">${MYB[k].e} ${MYB[k].n} ×${b[k]}</span>`).join('');
    el.querySelectorAll('.bp').forEach(s => s.onclick = () => { boostOff[s.dataset.k] = !boostOff[s.dataset.k]; renderBoosts(); });
  });
}
function takeBoosts(){ const b = getBoosts(), used = {}; for (const k in MYB) if (b[k] > 0 && !boostOff[k]){ b[k]--; used[k] = 1; } setBoosts(b); return used; }
function boostToast(used){ const n = Object.keys(used).map(k => MYB[k].e).join(' '); return n ? '🎰 Бонусы: ' + n : ''; }
renderBoosts();

// ---------- управление ----------
cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
addEventListener('keydown', e => { if (e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); state==='play' ? flap() : (state!=='dead' && start()); } });
$('playBtn').onclick = start; $('againBtn').onclick = start;
document.querySelectorAll('.menuBtn').forEach(b => b.onclick = () => location.href = MENU_URL);
$('shareBtn').onclick = () => {
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(location.href.replace(/[^/]*$/, '')) + '&text=' + encodeURIComponent(`Я набрал ${score} очков в Mochi Fly 🍥 Сможешь побить?`);
  tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank');
};

// ---------- спавн ----------
function spawn(){
  if (fx.clear > 0){   // чистая дорога: только дуга булочек
    const cy = H*.25 + Math.random()*H*.45;
    for (let i=0;i<5;i++) coins.push({ x: W + 40 + i*R0()*1.5, y: cy + Math.sin(i/4*Math.PI)*-H*.08, a: i });
    return;
  }
  const gap = Math.max(H*.24, H*.34 - score*H*.0025);
  const margin = H*.12, top = margin + Math.random()*(H - gap - margin*2);
  const w = Math.max(54, W*.15);
  pipes.push({ x: W + 40, top, gap, w, passed: false, wob: Math.random()*6, move: score >= 15 });
  const cx = W + 40 + w/2, cy = top + gap/2;
  if (score >= 2 && Math.random() < .22) items.push({ x: cx, y: cy, k: randPw(), a: Math.random()*6 });
  else if (Math.random() < .7) coins.push({ x: cx, y: cy + (Math.random()-.5)*gap*.4, a: 0 });
}

// ---------- рисование ----------
function drawFloat(x, y, w, h){
  const sw = w*.36;
  for (let i=0;i<2;i++){
    const sx = x + (i ? w-sw : 0);
    ctx.save(); ctx.translate(sx, 0); ctx.fillStyle = stickGrad(sw); ctx.strokeStyle = '#1f2230'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(0, y, sw, h, 12); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#e8457a'; ctx.fillRect(sx+2, y+10, sw-4, 10); ctx.fillRect(sx+2, y+h-20, sw-4, 10);
  }
  // бумажная обёртка посередине
  const bh = Math.min(34, h*.3), by = y + h/2 - bh/2;
  ctx.fillStyle = '#fff4e6'; ctx.strokeStyle = '#1f2230'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x-4, by, w+8, bh, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8457a'; ctx.beginPath(); ctx.arc(x + w/2, by + bh/2, bh*.22, 0, 7); ctx.fill();
}
const rgb = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
function drawChopstick(x, y, w, h, fromTop){
  const sw = w*.36;
  for (let i=0;i<2;i++){
    const sx = x + (i ? w-sw : 0);
    ctx.save(); ctx.translate(sx, 0); ctx.fillStyle = stickGrad(sw); ctx.strokeStyle = '#1f2230'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(0, y, sw, h, 10); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#e8457a'; ctx.fillRect(sx+2, fromTop ? y+h-26 : y+12, sw-4, 12);
  }
}
function drawCoin(c){
  const r = R0()*.55, s = Math.abs(Math.cos(c.a));
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(.4+.6*s, 1);
  ctx.fillStyle='#f0a020'; ctx.strokeStyle='#1f2230'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();
  for (let a=0;a<12;a+=.2){ const rr=a*r*.065; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.stroke(); ctx.restore();
}
function drawItem(it){
  const r = R0()*.8, bob = Math.sin(it.a)*6, good = PW[it.k].good;
  ctx.save(); ctx.translate(it.x, it.y + bob);
  ctx.fillStyle = good ? 'rgba(205,238,255,.85)' : 'rgba(255,205,215,.85)'; ctx.strokeStyle = '#1f2230'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.stroke();
  ctx.font = `${r*1.05}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(PW[it.k].e, 0, r*.06);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,r*.75,3.6,4.4); ctx.stroke();
  ctx.restore();
}
function drawMochi(){
  const r = R();
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1/p.sq*.98+.02, p.sq);
  if (inv > 0 && Math.floor(inv/5)%2) ctx.globalAlpha = .4;
  if (fx.pepper > 0){ for (let i=0;i<3;i++){ ctx.fillStyle = `rgba(255,${120+i*40},60,${.5-i*.15})`; ctx.beginPath(); ctx.arc(-r*(1+i*.5), (Math.random()-.5)*r*.4, r*(.4-i*.1), 0, 7); ctx.fill(); } }
  if (mochi.complete) ctx.drawImage(mochi, -r*1.1, -r*1.1, r*2.2, r*2.2);
  if (state==='dead'){ ctx.strokeStyle='#1f2230'; ctx.lineWidth=3;
    for (const ex of [-r*.42, r*.42]){ ctx.beginPath(); ctx.moveTo(ex-6,r*.05-6);ctx.lineTo(ex+6,r*.05+6);ctx.moveTo(ex+6,r*.05-6);ctx.lineTo(ex-6,r*.05+6);ctx.stroke(); } }
  ctx.restore();
  if (shield){ ctx.save(); ctx.strokeStyle = `rgba(120,200,255,${.6+.3*Math.sin(t*.15)})`; ctx.lineWidth = 5; ctx.fillStyle = 'rgba(150,220,255,.18)';
    ctx.beginPath(); ctx.arc(p.x, p.y, r*1.35, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); }
  if (fx.magnet > 0){ ctx.save(); ctx.strokeStyle = 'rgba(232,69,122,.35)'; ctx.lineWidth = 2; ctx.setLineDash([6,8]); ctx.lineDashOffset = -t*2;
    ctx.beginPath(); ctx.arc(p.x, p.y, R0()*3.2, 0, 7); ctx.stroke(); ctx.restore(); }
}
function drawBg(spd){
  const ti = Math.floor(score/10) % THEMES.length, T0 = THEMES[ti];
  for (const k of ['a','b','g']) for (let i=0;i<3;i++) th[k][i] += (T0[k][i] - th[k][i]) * .02;
  const ca = rgb(th.a), cb = rgb(th.b), key = ca + cb;
  if (key !== bgKey){ bgKey = key; bgGrad = ctx.createLinearGradient(0,0,0,H); bgGrad.addColorStop(0, ca); bgGrad.addColorStop(1, cb); }
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);
  const night = Math.max(0, 1 - th.a[0]/120);
  if (night > 0){ ctx.fillStyle = `rgba(255,255,255,${night})`; for (const s of stars){ ctx.globalAlpha = night*(.5+.5*Math.sin(t*.05+s.x*50)); ctx.fillRect(s.x*W, s.y*H, s.s, s.s); } ctx.globalAlpha = 1; }
  ctx.fillStyle = `rgba(255,255,255,${.8 - night*.6})`;
  for (const c of clouds){ c.x -= c.v*(state==='play' ? spd/3 : 1); if (c.x < -120){ c.x = W+80; c.y = Math.random()*H*.7; }
    ctx.beginPath(); ctx.arc(c.x, c.y, 26*c.s, 0, 7); ctx.arc(c.x+28*c.s, c.y-10*c.s, 32*c.s, 0, 7); ctx.arc(c.x+58*c.s, c.y, 24*c.s, 0, 7); ctx.fill(); }
  if (fx.clear > 0){ // радуга
    ctx.save(); ctx.globalAlpha = Math.min(.45, fx.clear/60*.45);
    ['#ff6b6b','#ffb04a','#ffe14a','#7ed957','#5ab8ff','#9d8cff'].forEach((c,i)=>{ ctx.strokeStyle=c; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(W*.6, H*.9, H*.5 - i*12, Math.PI, 0); ctx.stroke(); });
    ctx.restore(); }
  const gy = H - H*.06;
  ctx.fillStyle = rgb(th.g); ctx.fillRect(0, gy, W, H-gy);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; const off = (t*spd*.5) % 40;
  for (let x=-off; x<W; x+=40){ ctx.beginPath(); ctx.arc(x, gy, 14, Math.PI, 0); ctx.fill(); }
  ctx.strokeStyle='#1f2230'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
}
let fxTick = 0;
function renderFx(){
  const keys = []; if (shield) keys.push('shield'); for (const k in fx) if (fx[k] > 0) keys.push(k);
  const key = keys.join(','), box = $('fx');
  if (key !== fxKey){ fxKey = key; box.innerHTML = keys.map(k => k === 'shield' ? `<div class="fx">🛡️</div>` : `<div class="fx${PW[k].good?'':' bad'}" data-k="${k}">${PW[k].e} <b></b><i></i></div>`).join(''); }
  for (const el of box.children){ const k = el.dataset.k; if (!k) continue; const s = String(Math.ceil(fx[k]/60)), b = el.firstElementChild;
    if (b.textContent !== s) b.textContent = s; el.lastElementChild.style.width = Math.min(100, fx[k]/PW[k].d*100) + '%'; }
}

// ---------- цикл ----------
let last = performance.now();
function loop(now){
  perfTick(now-last); const dt = Math.min(2, (now-last)/16.67); last = now; t += dt;
  const groundY = H - H*.06;
  const mult = (fx.slow > 0 ? .55 : 1) * (fx.pepper > 0 ? 1.45 : 1);
  const spd = speed * mult;
  const targetScale = fx.tiny > 0 ? .6 : fx.cake > 0 ? 1.4 : 1;
  p.scale += (targetScale - p.scale) * .1 * dt;
  const r = R();

  if (state === 'menu'){ p.y = H*.45 + Math.sin(t*.06)*14; p.rot = Math.sin(t*.04)*.1; p.x = W*.5; }
  if (state === 'play' || state === 'dead'){
    const gmul = fx.slow > 0 ? .75 : 1;
    p.vy = Math.min(H*.012, p.vy + H*.00045*dt*gmul); p.y += p.vy*dt*(fx.slow > 0 ? .85 : 1);
    p.rot += ((state==='dead' ? 2.5 : Math.max(-.3, Math.min(.6, p.vy*.05))) - p.rot)*.1*dt;
    if (p.y > groundY - r){
      p.y = groundY - r;
      if (state === 'play' && (shield || inv > 0)){ p.vy = -H*.016; if (shield) hit(null); }
      else { p.vy = state==='dead' ? 0 : p.vy; die(); }
    }
    if (p.y < r*.5){ p.y = r*.5; p.vy = 0; }
  }
  p.sq += (1-p.sq)*.18*dt;

  if (state === 'play'){
    speed = W*.0045 + 2 + Math.min(score*.05, 4);
    for (const k in fx) if (fx[k] > 0){ fx[k] -= dt; if (fx[k] <= 0){ fx[k] = 0; if (k==='clear') timer = 30; } }
    if (inv > 0) inv -= dt;
    if ((fxTick += dt) > 6){ fxTick = 0; renderFx(); }

    timer -= dt * mult;
    if (timer <= 0){ spawn(); timer = fx.clear > 0 ? 70 : Math.max(52, 92 - score*.7) * Math.min(1, W/400 + .3); }

    for (const pp of pipes){
      pp.x -= spd*dt;
      if (pp.move) pp.top += Math.sin(t*.03 + pp.wob) * .6 * dt * mult;
      if (!pp.passed && pp.x + pp.w < p.x){ pp.passed = true; addScore(1); sfx.score(); }
      const hr = r*.78;
      for (const [ry, rh] of [[-1000, pp.top+1000],[pp.top+pp.gap, H]]){
        const cx = Math.max(pp.x, Math.min(p.x, pp.x+pp.w)), cy = Math.max(ry, Math.min(p.y, ry+rh));
        if ((p.x-cx)**2 + (p.y-cy)**2 < hr*hr){ hit(pp); break; }
      }
    }
    pipes = pipes.filter(pp => pp.x > -pp.w-20);

    for (const c of coins){
      c.x -= spd*dt; c.a += .08*dt;
      if (fx.magnet > 0){ const dx = p.x-c.x, dy = p.y-c.y, d = Math.hypot(dx,dy); if (d < R0()*3.2){ c.x += dx/d*9*dt; c.y += dy/d*9*dt; } }
      if (!c.got && (c.x-p.x)**2 + (c.y-p.y)**2 < (r*1.2)**2){
        c.got = true; buns++; combo++; comboT = 140; addScore(combo >= 3 ? 2 : 1); sfx.coin(); haptic('coin');
        if (combo >= 2){ $('combo').textContent = `x${combo} КОМБО!`; $('combo').style.opacity = 1; }
        burst(c.x, c.y, ['#f0a020'], 12, 4);
      }
    }
    coins = coins.filter(c => !c.got && c.x > -40);
    for (const it of items){
      it.x -= spd*dt; it.a += .08*dt;
      if (!it.got && (it.x-p.x)**2 + (it.y-p.y)**2 < (r + R0()*.8)**2){ it.got = true; applyPw(it.k); renderFx(); }
    }
    items = items.filter(it => !it.got && it.x > -60);
    if (comboT > 0){ comboT -= dt; if (comboT <= 0){ combo = 0; $('combo').style.opacity = 0; } }
  }

  ctx.save();
  if (shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .88; if (shake < .5) shake = 0; }
  drawBg(state==='play' ? spd : 2);
  for (const pp of pipes){ drawChopstick(pp.x, -10, pp.w, pp.top+10, true); drawChopstick(pp.x, pp.top+pp.gap, pp.w, groundY-(pp.top+pp.gap), false); }
  for (const c of coins) drawCoin(c);
  for (const it of items) drawItem(it);
  for (const q of parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=.15*dt; q.l-=dt;
    ctx.globalAlpha = Math.max(0, q.l/30); ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill(); }
  ctx.globalAlpha = 1; parts = parts.filter(q => q.l > 0);
  drawMochi();
  if (fx.slow > 0){ ctx.fillStyle = 'rgba(120,200,255,.12)'; ctx.fillRect(0,0,W,H); }
  if (state==='dead'){ ctx.fillStyle = `rgba(255,255,255,${Math.min(.35, shake/30)})`; ctx.fillRect(0,0,W,H); }
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
